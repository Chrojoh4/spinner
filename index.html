<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101923">
  <meta name="description" content="A quick spin. A random order of 0, 1 and 2.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <title>123 Spin</title>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">RANDOM ROOM ORDER</p><h1>012 <span>SPIN</span></h1><p class="intro">Three rooms. One random order.</p></header>
    <section class="machine" aria-label="Number spinner">
      <div class="windows" aria-hidden="true"><div class="window"><div class="reel">1</div></div><div class="window"><div class="reel">2</div></div><div class="window"><div class="reel">3</div></div></div>
      </section>
    <p id="result" class="result" role="status" aria-live="polite">Ready when you are.</p>
    <button id="spin" class="spin" type="button">SPIN <span aria-hidden="true">↻</span></button>
    <footer><button id="install" type="button" hidden>Install app</button><details><summary>Install on your phone</summary><p>Open this site's link in Chrome on Android. Tap <strong>Install app</strong> when offered, or use Chrome’s menu → <strong>Add to Home screen</strong> → <strong>Install</strong>.</p><p id="offline">Preparing offline access…</p></details></footer>
  </main>
</body>
</html>
